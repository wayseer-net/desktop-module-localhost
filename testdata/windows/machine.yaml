      - {idle: 1400, kernel: 1600, user: 500}
      - {idle: 1900, kernel: 2000, user: 100}
      - {idle: 1900, kernel: 2000, user: 100}
    memory: {total: 17179869184, avail: 6442450944}
    counters:
      7: {in: 1200000, out: 540000}
      12: {in: 0, out: 0}
