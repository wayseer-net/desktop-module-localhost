    running: {0: 0, 4: 0, 700: 5000000, 880: 9000000, 1040: 7000000, 1500: 100000, 2900: 300000, 3100: 200000, 3500: 400000, 3700: 50000, 5200: 2000000}
    services: # the spooler is asked to stop, BITS stops itself, ContosoSync crashes and Search starts
      RpcSs: {state: 4, pid: 1040}
      RpcEptMapper: {state: 4, pid: 1040}
      DcomLaunch: {state: 4, pid: 880}
      Spooler: {state: 3, pid: 2900}
      LanmanWorkstation: {state: 4, pid: 1500}
      WinBackup: {state: 4, pid: 3100}
      WSearch: {state: 4, pid: 3700}
      BITS: {state: 1}
